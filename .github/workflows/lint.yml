name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-compile:
    name: Python ${{ matrix.python-version }} compile check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile entry point and workbench package
        run: python -m compileall -q service_manager.py workbench

      - name: AST parse all sources
        run: |
          python -c "import ast,pathlib; fs=[pathlib.Path('service_manager.py'),*pathlib.Path('workbench').rglob('*.py')]; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for p in fs]; print('AST OK:', len(fs), 'files')"

  bat-line-endings:
    name: .bat files are CRLF
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .bat files use CRLF line endings
        shell: cmd
        run: |
          for %%f in (*.bat) do (
            powershell -NoProfile -Command "$b=[IO.File]::ReadAllBytes('%%f'); if ($b -notcontains 13) { Write-Error 'Not CRLF: %%f'; exit 1 } else { Write-Host 'OK: %%f' }"
          )
